[package]
name = "cargo-heft"
version = "0.1.0"
edition = "2024"
description = "Find out what takes up space in your Cargo target directory."
license = "MIT OR Apache-2.0"
repository = "https://github.com/eltonlaice/cargo-heft"
keywords = ["cargo", "subcommand", "target", "disk", "size"]
categories = ["development-tools::cargo-plugins"]
readme = "README.md"
rust-version = "1.88"
exclude = ["bench/", ".github/", "tests/"]

[dependencies]
object = { version = "0.41", default-features = false, features = ["read_core", "archive", "elf", "macho", "coff"] }
serde_json = "1"
