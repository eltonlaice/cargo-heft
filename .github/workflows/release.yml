name: Release

# Publishes the version in Cargo.toml when a matching tag is pushed:
#
#   git tag v0.1.1 && git push origin v0.1.1
#
# crates.io trusts this workflow directly (Trusted Publishing), so no token
# is stored in the repository.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC token exchange with crates.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must match the version in Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$TAG" = "v$version" || { echo "tag $TAG, Cargo.toml $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: cargo test
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: GitHub release with the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md
