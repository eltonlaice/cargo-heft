name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        include:
          # The minimum supported Rust version, declared in Cargo.toml.
          - os: ubuntu-latest
            toolchain: "1.88"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy,rustfmt && rustup default "$TOOLCHAIN"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --no-fail-fast
      - name: Run on its own target directory
        run: cargo run --quiet -- --top 5

  layout-v2:
    name: build-dir v2 layout (Cargo 1.100)
    runs-on: ubuntu-latest
    env:
      HEFT_REQUIRE_CARGO_1_100: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Builds tests/fixture with a real Cargo 1.100 and checks that the
      # build/<pkg>/<hash>/out and run/ units are measured correctly.
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: cargo test --test layouts

  workflows:
    name: lint workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # zizmor uploads its findings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
